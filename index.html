<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced To-Do List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <script src="https://apis.google.com/js/api.js"></script>


</head>
<body>
    
      
    <!-- Welcome Screen -->
    <div id="welcomeScreen">
        <h1>Welcome to Your To-Do List</h1>
        <p>Organize your tasks efficiently!</p>
        <p class="quote">"The secret of getting ahead is getting started." – Mark Twain</p>
        <div id="clockContainer">
            <h2 id="clock"></h2>
            <p class="time-message">"Time is precious, make every second count!" </p>
        </div>
        <button onclick="startApp()">Get Started</button>
    </div>

    <!-- App Container -->
    <div id="appContainer" class="container my-5" style="display: none;">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="text-center mb-4">📝 To-Do List</h2>
                
                <!-- Task Input Section -->
                <div class="mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Enter a task...">
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <input type="date" id="dueDate" class="form-control">
                    </div>
                    <div class="col">
                        <input type="time" id="dueTime" class="form-control">
                    </div>
                </div>
                <div class="input-group mb-3">
                    <select id="category" class="form-select">
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Study">Study</option>
                    </select>
                    <button id="stopAlarm" style="display:none;" class="btn btn-danger">Stop Alarm</button>
                    <button class="btn btn-success" onclick="addTask()">➕ Add Task</button>
                </div>

                <!-- Task List -->
                <ul id="taskList" class="list-group"></ul>

                <!-- Task Progress Chart -->
                <div id="taskChartContainer">
                    <canvas id="taskChart" width="300" height="300"></canvas>
                </div>
            </div>
        </div>

        <!-- Dark Mode Toggle -->
        <button onclick="toggleDarkMode()" class="btn btn-secondary mt-3">🌙 Toggle Dark Mode</button>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3">
        <p>Developed by <strong>Shaheen</strong></p>
    </footer>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
